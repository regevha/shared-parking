name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Test-only secret; the backend refuses to start without SECRET_KEY.
  SECRET_KEY: ci-only-secret-key-not-for-production

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-test.txt
      - run: ruff check .
      # test_infra_hardening asserts the dev database is seeded (as the README instructs)
      - run: python seed.py
      - run: pytest tests/ -v

  frontend:
    name: Frontend (eslint + jest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci --watchAll=false
        env:
          CI: 'true'
      - run: npm run build
        env:
          CI: 'true'

  e2e-a11y:
    name: E2E accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r backend/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed database and start servers
        run: |
          cd backend && python seed.py
          nohup python -m uvicorn main:app --port 8000 > ../backend.log 2>&1 &
          cd .. && BROWSER=none nohup npm start > frontend.log 2>&1 &
          npx --yes wait-on http://localhost:8000/ http://localhost:3000 --timeout 180000
      - run: npx playwright test accessibility
        env:
          CI: 'true'
      - name: Upload Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artefacts
          path: |
            test-results/
            backend.log
            frontend.log
          retention-days: 7
