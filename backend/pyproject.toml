[tool.ruff]
target-version = "py311"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
# Correctness-focused rules only: pycodestyle errors (E4/E7/E9) and pyflakes (F).
# Style rules (line length, import sorting) are intentionally not enforced yet.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # SQLAlchemy needs `Column == True/False`; `is`/`not` would silently break the query.
    "E712",
]

[tool.ruff.lint.per-file-ignores]
# main.py configures logging before importing the app modules, on purpose.
"main.py" = ["E402"]
